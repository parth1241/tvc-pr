<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startup Signal Trap</title>
  <script type="module" crossorigin src="./assets/signaltrap-DWIFYq8-.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="./assets/signaltrap-BnXZxC9D.css">
</head>

<body>
    <div id="app">
        <div class="side-panel left">
            <div id="lives-box">
                <div class="label">RUNWAY</div>
                <div id="lives-val">3</div>
            </div>
        </div>

        <div class="side-panel right">
            <div class="legend-box">
                <div class="legend-title">OBJECTIVES</div>
                <div class="legend-item">
                    <span class="dot green"></span> Signal (+$1k)
                </div>
                <div class="legend-item">
                    <span class="dot gold"></span> Angel (+$5k)
                </div>
                <div class="legend-item">
                    <span class="dot red"></span> Bug (-1 Life)
                </div>
                <div class="legend-item">
                    <span class="dot orange"></span> Fees (-$2k)
                </div>
                <div class="controls-hint">
                    USE WASD / ARROWS
                </div>
            </div>
        </div>


        <canvas id="gameCanvas" width="600" height="800"></canvas>
    </div>


    <div class="branding">Thapar Venture Club | E-SUMMIT 26'</div>
    <a href="index.html" class="back-home">← Back to Hub</a>
    </div>
</body>

</html>

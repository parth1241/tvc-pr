<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Trap 1v1 - Multiplayer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Multiplayer Specific Styles */
        #lobby-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #00FF41;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #lobby-area.hidden {
            display: none;
        }

        #qrcode-container {
            background: #fff;
            padding: 10px;
            margin: 10px;
            border: 4px solid #00FF41;
        }

        #player-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .player-card {
            border: 1px solid #333;
            padding: 5px;
            font-size: 10px;
            color: #fff;
            background: #111;
        }

        .lobby-btn {
            background: #00FF41;
            color: #000;
            font-family: 'Press Start 2P';
            border: none;
            padding: 15px;
            margin: 10px;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
        }

        #nickname-input {
            background: #000;
            border: 2px solid #00FF41;
            color: #00FF41;
            font-family: 'Press Start 2P';
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            width: 80%;
        }
    </style>
  <script type="module" crossorigin src="./assets/wordtrapParty-DS4xk1I2.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/Game-B6bx1sEb.js">
  <link rel="stylesheet" crossorigin href="./assets/Game-D7Phsod3.css">
</head>

<body>
    <div id="app">
        <div class="crt-overlay"></div>

        <!-- LOBBY OVERLAY -->
        <div id="lobby-area">
            <h1>PARTY MODE</h1>
            <p id="lobby-status">Scanning...</p>

            <!-- Host View -->
            <div id="host-view" class="hidden">
                <div id="qrcode-wrapper">
                    <canvas id="qr-canvas"></canvas>
                    <p style="font-size: 10px; margin-top: 5px;">Scan to Join</p>
                </div>
                <div id="player-grid">
                    <!-- Players appear here -->
                </div>
                <button id="btn-start" class="lobby-btn hidden">START GAME</button>
            </div>

            <!-- Guest View -->
            <div id="guest-view" class="hidden">
                <p>ENTER CODENAME:</p>
                <input type="text" id="nickname-input" placeholder="AGENT_X" maxlength="10">
                <button id="btn-join" class="lobby-btn">JOIN MATCH</button>
            </div>

            <!-- Initial Choice (If visiting directly) -->
            <div id="role-select">
                <button id="btn-host" class="lobby-btn">HOST PARTY</button>
            </div>
        </div>

        <div class="hud">
            <!-- Modified HUD for Party -->
            <div class="panel left">
                <div class="label">VALUATION (LIVES)</div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <div id="score-val" style="color: #00FF41;">$0</div>
                    <div id="lives-val" style="color: #ff4136;">3</div>
                </div>
                <!-- Hidden level val to prevent crash -->
                <div id="level-val" class="hidden">1</div>
            </div>

            <div class="panel center">
                <div class="label">TIME</div>
                <div id="time-bar-container">
                    <div id="time-bar"></div>
                </div>
            </div>

            <div class="panel right">
                <div class="label">LEADERBOARD</div>
                <div id="rank-val" style="color: #FFD700;">#1</div>
            </div>
        </div>

        <!-- Reusing standard Game Area -->
        <div class="game-area">
            <div id="message-area" class="hidden">
                <h1 id="message-title">WAITING FOR HOST</h1>
                <p id="message-sub">System Sync In Progress...</p>
                <button id="start-btn" class="hidden">START MATCH</button>
            </div>

            <div id="word-display-container">
                <div id="word-display">CONNECTING</div>
            </div>
        </div>

        <div class="controls-area">
            <button id="btn-no" class="game-btn red">
                <span class="icon">✖</span>
                <span class="text">NOPE</span>
            </button>
            <button id="btn-yes" class="game-btn green">
                <span class="icon">✔</span>
                <span class="text">STARTUP</span>
            </button>
        </div>

        <div class="scanlines"></div>
    </div>

    <div class="branding">Thapar Venture Club | E-SUMMIT 26' <span style="color: #555; font-size: 8px;">(v2.1 -
            PATCHED)</span></div>
    <a href="index.html" class="back-home">← LEAVE MATCH</a>

</body>

</html>
